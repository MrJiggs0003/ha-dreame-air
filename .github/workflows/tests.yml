name: Tests

on:
  push:
  pull_request:
  schedule:
    # Weekly, to catch a new Home Assistant release breaking the integration.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv venv --python 3.14 .venv
      - run: uv pip install -r requirements_dev.txt
      - run: scripts/lint --check
      - run: scripts/test

  pytest-minimum:
    name: pytest (oldest supported Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv venv --python 3.13 .venv
      - run: uv pip install -r requirements_min.txt
      - run: scripts/test
