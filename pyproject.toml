[project]
name = "ha-dreame-air"
version = "0.1.2"
description = "Home Assistant integration for Dreame air purifiers"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S310", "S324"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.dreame_air"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Home Assistant aliases voluptuous to probatio at runtime, but mypy sees the
# real voluptuous types. Importing probatio would drop older Home Assistant.
module = "custom_components.dreame_air.config_flow"
disable_error_code = ["arg-type"]
